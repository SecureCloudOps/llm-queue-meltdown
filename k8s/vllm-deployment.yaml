apiVersion: v1
kind: Namespace
metadata:
  name: vllm-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: vllm-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/arch: arm64
        kubernetes.io/os: linux
      containers:
        - name: vllm
          image: vllm/vllm-openai-cpu@sha256:09e656588c2dc572240cb62a22f75681dc640a99c61537bbd55e9eb1dc3d4fbc
          imagePullPolicy: IfNotPresent
          args:
            - HuggingFaceTB/SmolLM2-135M-Instruct
            - --revision=12fd25f77366fa6b3b4b768ec3050bf629380bac
            - --served-model-name=lab-small
            - --dtype=bfloat16
            - --max-model-len=1024
            - --max-num-seqs=8
            - --kv-cache-memory-bytes=268435456
            - --max-num-batched-tokens=256
            - --enforce-eager
            - --host=0.0.0.0
            - --port=8000
          env:
            - name: TCMALLOC_RELEASE_RATE
              value: "10"
            - name: TCMALLOC_MAX_TOTAL_THREAD_CACHE_BYTES
              value: "16777216"
            - name: VLLM_CPU_OMP_THREADS_BIND
              value: nobind
            - name: OMP_NUM_THREADS
              value: "1"
            - name: HF_HOME
              value: /model-cache
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "1"
              memory: 2560Mi
            limits:
              cpu: "1"
              memory: 3Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: model-cache
              mountPath: /model-cache
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: model-cache
          emptyDir:
            sizeLimit: 4Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
