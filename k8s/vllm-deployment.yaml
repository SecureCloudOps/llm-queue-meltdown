apiVersion: v1
kind: Namespace
metadata:
  name: vllm-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: vllm-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/arch: amd64
        eks.amazonaws.com/nodegroup: gpu
        kubernetes.io/os: linux
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.11.2
          imagePullPolicy: IfNotPresent
          args:
            - HuggingFaceTB/SmolLM2-135M-Instruct
            - --revision=12fd25f77366fa6b3b4b768ec3050bf629380bac
            - --served-model-name=lab-small
            - --dtype=float16
            - --max-model-len=1024
            - --max-num-seqs=8
            - --kv-cache-memory-bytes=268435456
            - --max-num-batched-tokens=256
            - --gpu-memory-utilization=0.8
            - --no-enable-prefix-caching
            - --enforce-eager
            - --host=0.0.0.0
            - --port=8000
          env:
            - name: HF_HOME
              value: /model-cache
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              nvidia.com/gpu: 1
            limits:
              cpu: "3"
              memory: 8Gi
              nvidia.com/gpu: 1
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: model-cache
              mountPath: /model-cache
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: model-cache
          emptyDir:
            sizeLimit: 4Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
