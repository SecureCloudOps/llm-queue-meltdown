apiVersion: v1
kind: ServiceAccount
metadata: {name: load-generator, namespace: vllm-lab}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: load-generator, namespace: vllm-lab}
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: load-generator, namespace: vllm-lab}
subjects:
  - {kind: ServiceAccount, name: load-generator, namespace: vllm-lab}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: load-generator}
---
apiVersion: v1
kind: Pod
metadata: {name: load-generator, namespace: vllm-lab}
spec:
  serviceAccountName: load-generator
  restartPolicy: Never
  containers:
    - name: load
      image: python:3.12-slim
      command: [python, '-c', 'import time; time.sleep(86400)']
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 250m, memory: 128Mi}
      volumeMounts:
        - {name: script, mountPath: /scripts}
        - {name: results, mountPath: /results}
  volumes:
    - name: script
      configMap: {name: load-test}
    - name: results
      emptyDir: {sizeLimit: 256Mi}
